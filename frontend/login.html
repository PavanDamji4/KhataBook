<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — KhataBook</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary:     '#d63031',
            primaryDark: '#b71c1c',
            accent:      '#e17055',
            surface:     '#fafafa',
            muted:       '#6b7280',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .login-bg {
      background: linear-gradient(135deg, #fff5f5 0%, #fff0e6 50%, #fafafa 100%);
    }
    .brand-bar {
      background: linear-gradient(90deg, #d63031, #e17055);
    }
  </style>
</head>
<body class="login-bg min-h-screen flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="brand-bar inline-block px-4 py-1 mb-4">
        <span class="text-white text-xs font-bold tracking-widest uppercase">Business Manager</span>
      </div>
      <h1 class="text-4xl font-black text-gray-900 tracking-tight">KhataBook</h1>
      <p class="text-muted text-sm mt-2">Sign in to access your business dashboard</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-gray-200 shadow-sm p-8">

      <div id="errorMsg" class="hidden bg-red-50 border-l-4 border-primary text-primary text-sm px-4 py-3 mb-5">
        Invalid username or password.
      </div>

      <div class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">
            Username
          </label>
          <input type="text" id="username" placeholder="Enter username"
            class="w-full border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:border-primary"
            onkeydown="if(event.key==='Enter') handleLogin()"/>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">
            Password
          </label>
          <div class="relative">
            <input type="password" id="password" placeholder="Enter password"
              class="w-full border border-gray-300 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:border-primary pr-10"
              onkeydown="if(event.key==='Enter') handleLogin()"/>
            <button onclick="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-xs">
              SHOW
            </button>
          </div>
        </div>

        <button onclick="handleLogin()" id="loginBtn"
          class="w-full bg-primary hover:bg-primaryDark text-white py-3 text-sm font-bold tracking-wide uppercase transition-all">
          Sign In
        </button>
      </div>

      <p class="text-center text-xs text-gray-400 mt-6">
        KhataBook — Private Business Use Only
      </p>
    </div>

  </div>

  <script>
    // Check already logged in
    if (sessionStorage.getItem("kb_auth") === "true") {
      window.location.href = "index.html";
    }

    function handleLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const btn      = document.getElementById("loginBtn");
      const err      = document.getElementById("errorMsg");

      if (!username || !password) {
        err.textContent = "Please enter both username and password.";
        err.classList.remove("hidden");
        return;
      }

      btn.textContent = "Signing in...";
      btn.disabled = true;

      setTimeout(() => {
        if (username === "Chandrakala" && password === "Chandrakala123@") {
          sessionStorage.setItem("kb_auth", "true");
          sessionStorage.setItem("kb_user", username);
          window.location.href = "index.html";
        } else {
          err.textContent = "Invalid username or password.";
          err.classList.remove("hidden");
          btn.textContent = "Sign In";
          btn.disabled = false;
        }
      }, 600);
    }

    function togglePassword() {
      const inp = document.getElementById("password");
      const btn = event.target;
      if (inp.type === "password") {
        inp.type = "text";
        btn.textContent = "HIDE";
      } else {
        inp.type = "password";
        btn.textContent = "SHOW";
      }
    }
  </script>

</body>
</html>
